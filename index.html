<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professional Scientific Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="brand">Scientific Calculator</h1>
      <div class="topbar-actions">
        <button id="degToggle" class="icon-btn" title="Angle mode">DEG</button>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
        <button id="soundToggle" class="icon-btn" aria-label="Toggle sound">🔊</button>
      </div>
    </header>

    <main class="calc-panel">
      <div class="display">
        <div class="expr" id="expr" aria-live="polite"></div>
        <div class="result" id="result">0</div>
      </div>

      <div class="toolbar">
        <button class="tool-btn" id="copyBtn">Copy</button>
        <button class="tool-btn" id="clearExprBtn">CE</button>
        <button class="tool-btn" id="mcBtn">MC</button>
        <button class="tool-btn" id="mrBtn">MR</button>
        <button class="tool-btn" id="mplusBtn">M+</button>
        <button class="tool-btn" id="mminusBtn">M−</button>
      </div>

      <div class="panels">
        <!-- Scientific functions -->
        <section class="panel sci-panel">
          <h3 class="panel-title">Scientific</h3>
          <div class="sci-grid">
            <button class="btn sci" data-action="func" data-value="sin(">sin</button>
            <button class="btn sci" data-action="func" data-value="cos(">cos</button>
            <button class="btn sci" data-action="func" data-value="tan(">tan</button>
            <button class="btn sci" data-action="func" data-value="asin(">sin⁻¹</button>
            <button class="btn sci" data-action="func" data-value="acos(">cos⁻¹</button>
            <button class="btn sci" data-action="func" data-value="atan(">tan⁻¹</button>

            <button class="btn sci" data-action="func" data-value="log(">log</button>
            <button class="btn sci" data-action="func" data-value="ln(">ln</button>
            <button class="btn sci" data-value="^2">x²</button>
            <button class="btn sci" data-value="^">xʸ</button>
            <button class="btn sci" data-action="func" data-value="sqrt(">√</button>
            <button class="btn sci" data-action="func" data-value="cbrt(">∛</button>

            <button class="btn sci" data-action="func" data-value="abs(">|x|</button>
            <button class="btn sci" data-action="factorial">x!</button>
            <button class="btn sci" data-action="const" data-value="pi">π</button>
            <button class="btn sci" data-action="const" data-value="e">e</button>
            <button class="btn sci" data-action="func" data-value="exp(">exp</button>
            <button class="btn sci" data-value="(">(</button>
            <button class="btn sci" data-value=")">)</button>
            <button class="btn sci" data-value="%">%</button>
          </div>
        </section>

        <!-- Numeric keypad + AC/DEL -->
        <section class="panel num-panel">
          <h3 class="panel-title">Numbers</h3>
          <div class="top-actions">
            <button class="btn clear" data-action="ac">AC</button>
            <button class="btn clear" data-action="del">DEL</button>
          </div>
          <div class="num-grid">
            <button class="btn num" data-value="7">7</button>
            <button class="btn num" data-value="8">8</button>
            <button class="btn num" data-value="9">9</button>

            <button class="btn num" data-value="4">4</button>
            <button class="btn num" data-value="5">5</button>
            <button class="btn num" data-value="6">6</button>

            <button class="btn num" data-value="1">1</button>
            <button class="btn num" data-value="2">2</button>
            <button class="btn num" data-value="3">3</button>

            <button class="btn num" data-action="sign">+/−</button>
            <button class="btn num" data-value="0">0</button>
            <button class="btn num" data-value=".">.</button>
          </div>
        </section>

        <!-- Operators column -->
        <section class="panel op-panel">
          <h3 class="panel-title">Operators</h3>
          <div class="op-grid">
            <button class="btn op" data-value="/">÷</button>
            <button class="btn op" data-value="*">×</button>
            <button class="btn op" data-value="-">−</button>
            <button class="btn op" data-value="+">+</button>
            <button class="btn eq" data-action="equals">=</button>
          </div>
        </section>
      </div>

      <aside class="history-panel">
        <div class="history-header">
          <h2>History</h2>
          <button class="tool-btn" id="clearHistoryBtn">Clear</button>
        </div>
        <ul class="history-list" id="historyList"></ul>
        <p class="history-empty" id="historyEmpty">No calculations yet.</p>
      </aside>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
